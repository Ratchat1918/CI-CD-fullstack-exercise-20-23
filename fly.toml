# fly.toml app configuration file generated for nasa-api on 2026-08-05T15:41:33+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nasa-api'
primary_region = 'arn'

[build]
[env]
  PORT = '3000'

[processes]
  app = 'node app.js'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
